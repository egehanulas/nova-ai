<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>NOVA AI — Akıllı sohbet</title><link rel="stylesheet" href="style.css"></head>
