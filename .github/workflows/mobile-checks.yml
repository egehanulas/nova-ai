name: Mobile checks

on:
  pull_request:
    paths:
      - 'nova-ai/mobile/**'
      - '.github/workflows/mobile-checks.yml'
  push:
    branches: [main]
    paths:
      - 'nova-ai/mobile/**'
      - '.github/workflows/mobile-checks.yml'

jobs:
  expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-ai/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-ai/mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo export --platform all
