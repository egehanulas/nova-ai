name: npm security audit

on:
  push:
    branches: [main]
    paths:
      - "nova-ai/package.json"
      - "nova-ai/package-lock.json"
      - "nova-ai/server.js"
      - "nova-ai/public/**/*.js"
      - "nova-ai/scripts/**/*.js"
      - ".github/workflows/npm-security-audit.yml"
  pull_request:
    paths:
      - "nova-ai/package.json"
      - "nova-ai/package-lock.json"
      - "nova-ai/server.js"
      - "nova-ai/public/**/*.js"
      - "nova-ai/scripts/**/*.js"
      - ".github/workflows/npm-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: nova-ai
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed (attempt $attempt/3); retrying in 10 seconds..."
            sleep 10
          done

      - name: Check JavaScript syntax
        working-directory: nova-ai
        run: npm run check

      - name: Smoke test server and public configuration
        working-directory: nova-ai
        env:
          PORT: "43127"
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_test"
          SUPABASE_SERVICE_ROLE_KEY: "ci-secret-must-not-leak"
        run: |
          node server.js > /tmp/nova-ai-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:$PORT/health" > /tmp/nova-health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"status":"ok"' /tmp/nova-health.json
          curl -fsS "http://127.0.0.1:$PORT/config.js" > /tmp/nova-config.js
          grep -q 'https://example.supabase.co' /tmp/nova-config.js
          grep -q 'sb_publishable_ci_test' /tmp/nova-config.js
          if grep -q 'ci-secret-must-not-leak' /tmp/nova-config.js; then
            echo "Service-role secret leaked through public config"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:$PORT/" > /tmp/nova-index.html
          grep -q 'NOVA AI' /tmp/nova-index.html

      - name: Test local embedding model
        working-directory: nova-ai
        run: npm run test:embeddings

      - name: Audit production dependencies
        working-directory: nova-ai
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'const r=require("./npm-audit.json"); const v=r.metadata?.vulnerabilities || {}; console.log("VULNERABILITY SUMMARY:", JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities || {})) { const via=(item.via || []).map(x => typeof x === "string" ? x : x.title).join(" | "); console.log(name + " | severity=" + item.severity + " | range=" + item.range + " | fix=" + JSON.stringify(item.fixAvailable) + " | via=" + via); } if ((v.high || 0) + (v.critical || 0) > 0) process.exit(1);'
