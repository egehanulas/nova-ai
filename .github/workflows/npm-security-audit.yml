name: npm security audit

on:
  push:
    branches: [main]
    paths:
      - "nova-ai/package.json"
      - "nova-ai/package-lock.json"
      - "nova-ai/server.js"
      - "nova-ai/public/**/*.js"
      - "nova-ai/scripts/**/*.js"
      - ".github/workflows/npm-security-audit.yml"
  pull_request:
    paths:
      - "nova-ai/package.json"
      - "nova-ai/package-lock.json"
      - "nova-ai/server.js"
      - "nova-ai/public/**/*.js"
      - "nova-ai/scripts/**/*.js"
      - ".github/workflows/npm-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and commit the lockfile
        working-directory: nova-ai
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock npm dependencies"
            git push
          fi

      - name: Install dependencies
        working-directory: nova-ai
        run: npm ci --no-audit

      - name: Check JavaScript syntax
        working-directory: nova-ai
        run: npm run check

      - name: Test local embedding model
        working-directory: nova-ai
        run: npm run test:embeddings

      - name: Audit production dependencies
        working-directory: nova-ai
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'const r=require("./npm-audit.json"); const v=r.metadata?.vulnerabilities || {}; console.log("VULNERABILITY SUMMARY:", JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities || {})) { const via=(item.via || []).map(x => typeof x === "string" ? x : x.title).join(" | "); console.log(name + " | severity=" + item.severity + " | range=" + item.range + " | fix=" + JSON.stringify(item.fixAvailable) + " | via=" + via); } if ((v.high || 0) + (v.critical || 0) > 0) process.exit(1);'
