name: NOVA Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
    # Reserved release branches allow a controlled build when a tag cannot be created directly.
    branches:
      - "release/desktop-v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nova-ai/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run desktop security regression tests
        run: npm test

      - name: Clean previous build output
        shell: pwsh
        run: |
          if (Test-Path out) { Remove-Item out -Recurse -Force }

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -match '^refs/tags/(desktop-v.+)$') {
            $tag = $Matches[1]
          } elseif ($ref -match '^refs/heads/release/(desktop-v.+)$') {
            $tag = $Matches[1]
          } else {
            throw "Unsupported desktop release ref: $ref"
          }
          if ($tag -notmatch '^desktop-v[0-9]+[.][0-9]+[.][0-9]+-alpha[.][0-9]+$') {
            throw "Invalid desktop release tag: $tag"
          }
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Squirrel.Windows update packages
        run: npm run make -- --platform=win32 --arch=x64

      - name: Publish Windows installer and update feed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NOVA AI Desktop ${{ steps.release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            nova-ai/desktop/out/make/squirrel.windows/x64/*.exe
            nova-ai/desktop/out/make/squirrel.windows/x64/*.nupkg
            nova-ai/desktop/out/make/squirrel.windows/x64/RELEASES
