name: NOVA Alpha Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "nova-ai/**"
      - ".github/workflows/nova-alpha-checks.yml"
  pull_request:
    paths:
      - "nova-ai/**"
      - ".github/workflows/nova-alpha-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: nova-ai/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run syntax and regression tests
        run: npm run check
